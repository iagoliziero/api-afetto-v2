# =========================================================
# Perfil "test": usado SOMENTE pelos testes automáticos (CI)
# Banco H2 em memória, criado e apagado a cada execução,
# para os testes não dependerem do MySQL da nuvem.
# =========================================================
spring.datasource.url=jdbc:h2:mem:afetto-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# A migration V1 é escrita para o MySQL (BINARY(16)); nos testes o próprio
# Hibernate cria as tabelas a partir das entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
