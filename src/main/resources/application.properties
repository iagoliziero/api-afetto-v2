spring.application.name=java-afetto

# Conexão com o banco: os valores vêm de VARIÁVEIS DE AMBIENTE, nenhuma senha fica no código.
# - Na nuvem (Azure Web App): definidas nas configurações do aplicativo / variáveis secretas da pipeline.
# - Na máquina local: defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e
#   SPRING_DATASOURCE_PASSWORD antes de subir a API.
# - Nos testes: o perfil "test" troca tudo por um H2 em memória (src/test/resources).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
